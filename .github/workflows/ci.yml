name: Install test
# Every change to the manifest is installed, started and removed on a real
# Windows machine before anyone else's `scoop install` meets it.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        # x64, and Arm64 (Surface, Snapdragon laptops) on its own runner.
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install, start and remove Mihrab
        shell: pwsh
        run: ./scripts/test-install.ps1 bucket/mihrab.json
